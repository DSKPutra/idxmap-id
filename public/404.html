<!doctype html>
<!--
  GitHub Pages has no server-side rewrites, so a deep link like
  /idxmap-id/ticker/BBCA 404s at the edge. This page encodes the path (minus
  the repo base) into a query string and redirects to the base URL, which
  main.tsx decodes back before React Router takes over. Standard
  spa-github-pages trick, scoped to this repo's fixed base path.
-->
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>IDXMap.ID</title>
    <script>
      var base = '/idxmap-id'
      var l = window.location
      var afterBase = l.pathname.indexOf(base) === 0 ? l.pathname.slice(base.length) : l.pathname
      l.replace(base + '/?p=' + encodeURIComponent(afterBase + l.search) + l.hash)
    </script>
  </head>
  <body></body>
</html>
